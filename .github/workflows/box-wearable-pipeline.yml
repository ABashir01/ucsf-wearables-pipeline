name: Box Wearable Pipeline

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: box-wearable-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install .

      - name: Run pipeline
        env:
          BOX_CLIENT_ID: ${{ secrets.BOX_CLIENT_ID }}
          BOX_CLIENT_SECRET: ${{ secrets.BOX_CLIENT_SECRET }}
          BOX_SUBJECT_TYPE: ${{ secrets.BOX_SUBJECT_TYPE }}
          BOX_SUBJECT_ID: ${{ secrets.BOX_SUBJECT_ID }}
          BOX_SOURCE_ROOT_FOLDER_ID: ${{ secrets.BOX_SOURCE_ROOT_FOLDER_ID }}
          BOX_DESTINATION_FOLDER_ID: ${{ secrets.BOX_DESTINATION_FOLDER_ID }}
          BOX_CONTROL_FOLDER_ID: ${{ secrets.BOX_CONTROL_FOLDER_ID }}
          PIPELINE_SCHEDULE_LABEL: github-actions-daily
        run: python -m box_wearable_pipeline.cli run
